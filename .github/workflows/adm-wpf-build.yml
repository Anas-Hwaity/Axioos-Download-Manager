name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore ADM/ADM.Wpf.UI/ADM.Wpf.UI.csproj --locked-mode -p:Platform=x86
    - name: Build
      run: dotnet build ADM/ADM.Wpf.UI/ADM.Wpf.UI.csproj --no-restore -c Release -f net4.7.2 -p:Platform=x86 -p:UseSharedCompilation=false
